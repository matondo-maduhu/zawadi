# Render Blueprint (TOLEO LA KULIPIA): web service ya Starter + diski ya kudumu (SQLite).
# Zawadi hazipotei ukianzisha upya. Tumia faili hili badala ya render.yaml (lipe jina render.yaml kwenye repo yako).
services:
  - type: web
    name: zawadi
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    disk:
      name: zawadi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_PATH
        value: /var/data/zawadi.db
      - key: GIFT_TTL_DAYS
        value: "90"
