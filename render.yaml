# Render Blueprint (TOLEO LA BURE): web service ya Free + hifadhidata ya Postgres ya nje (Neon, bure).
# Hatua: tengeneza hifadhidata kwenye neon.com, nakili "connection string", Render itakuuliza uibandike
# kwenye DATABASE_URL wakati wa Apply. Toleo la kulipia liko kwenye render.paid.yaml.
services:
  - type: web
    name: zawadi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GIFT_TTL_DAYS
        value: "30"
      - key: DATABASE_URL
        sync: false
