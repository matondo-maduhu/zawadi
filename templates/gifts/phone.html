<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zawadi kwa {{ to_raw }} {{ cfg.ev.e }}</title>
<style>
/* ===== MISINGI (inatumika na mitindo yote) ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,serif;color:#fff;background:radial-gradient(ellipse at 50% 15%,var(--b1),var(--b2) 60%,#05030a)}
#stars{position:fixed;inset:0;pointer-events:none}
.st{position:absolute;background:#fff;border-radius:50%;animation:tw 1.8s infinite alternate;opacity:.6}
@keyframes tw{to{opacity:.15;transform:scale(.5)}}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#app{position:fixed;inset:0;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 40px;display:flex;z-index:2}
.box{width:100%;max-width:440px;margin:auto;text-align:center;padding:22px 18px;border:1px solid #ffffff3a;border-radius:26px;background:#0000007a;box-shadow:0 10px 50px #000a,0 0 50px var(--ac);backdrop-filter:blur(10px);animation:pop .6s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}
h1{font-size:clamp(28px,8.5vw,42px);margin:8px 0;line-height:1.2;background:linear-gradient(90deg,#ffd98a,#fff,#ffd98a);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
p{font-size:clamp(15px,4.2vw,18px);line-height:1.8;color:#fff3ea}
.em{font-size:clamp(40px,12vw,58px);margin:6px 0}
.hero{display:block;width:110px;height:110px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #ffd98a;box-shadow:0 0 30px var(--ac);margin:8px auto}
.btn{display:block;width:100%;max-width:320px;margin:14px auto 0;padding:14px 12px;border:2px solid #ffffff88;border-radius:50px;background:linear-gradient(100deg,var(--ac),#9d4edd);color:#fff;font:800 16px system-ui,sans-serif;cursor:pointer;box-shadow:0 0 22px var(--ac)}
.btn.gh{background:#ffffff18;box-shadow:none;font-weight:600}
.hearts{position:fixed;pointer-events:none;z-index:65;animation:rise 3s ease-out forwards}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-85vh) rotate(380deg) scale(1.4);opacity:0}}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:80;width:38px;height:38px;border-radius:50%;border:1px solid #fff5;background:#0006;color:#fff;font-size:17px;cursor:pointer}
#now{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;padding:6px 14px;border-radius:30px;background:#000a;font:12px system-ui,sans-serif;color:#ffe9a8;opacity:0;transition:opacity .5s;white-space:nowrap}
#now.on{opacity:1}
#st0{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 30%,var(--b1),#05030a);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}

/* ===== SIMU ===== */
#phn{position:fixed;inset:0;max-width:460px;margin:auto;background:#0b141a;z-index:5;display:flex;flex-direction:column;overflow:hidden}
#lk{flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(60px + env(safe-area-inset-top,0px)) 16px 24px;background-size:cover;background-position:center top;position:relative}
#lk:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0008,#000c)}#lk>*{position:relative}
#tm{font-size:clamp(70px,22vw,98px);font-weight:200;line-height:1}
#nts{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:10px}
.nt{display:flex;gap:12px;align-items:center;padding:13px;border-radius:20px;background:#ffffff30;backdrop-filter:blur(16px);cursor:pointer;animation:pop .6s both;text-align:left}
.nt i{font-style:normal;font-size:26px}.nt b{display:block;font-size:14px}.nt span{font-size:13px;opacity:.9}
#hn{margin-top:auto;font:13px system-ui;opacity:.8}
#ch{flex:1;flex-direction:column;background:#0b141a}
.hd{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:#202c33;font-family:system-ui}.hd b{display:block;font-size:16px}.hd span{font-size:12px;color:#7fe3b0}
#ms{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:7px;font-family:system-ui}
.b{max-width:80%;padding:9px 12px;border-radius:12px;font-size:16px;line-height:1.45;animation:pop .3s both}
.b.h{align-self:flex-start;background:#202c33}.b.me{align-self:flex-end;background:#005c4b}
#rp{padding:10px 12px 18px;background:#202c33;display:flex;flex-direction:column;gap:8px;min-height:20px}
#rp button{padding:13px;border:none;border-radius:24px;background:#005c4b;color:#fff;font:600 15px system-ui;cursor:pointer}
#cc{flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow-y:auto;background:linear-gradient(180deg,var(--b2),var(--b1))}
.cb{display:flex;gap:46px;margin-top:36px}.cb button{width:72px;height:72px;border-radius:50%;border:none;font-size:30px;cursor:pointer}

</style></head>
<body>
<div id="stars"></div><canvas id="fw"></canvas>
<button id="mute" type="button" style="display:none" aria-label="Sauti">🔊</button><div id="now"></div>
<div id="app"></div><div id="st0"></div>
<script>
// ===== INJINI YA MUZIKI NA FATAKI (partials/engine.js) =====
{% include "partials/engine.js" %}

// ===== DATA YA ZAWADI (inajazwa na app.py) =====
const CFG={{ cfg|tojson }};

// ===== MSAADA WA PAMOJA (maandishi, vitufe, sauti, mwisho) =====

const m=CFG.m,FB=["kila kitu tulichopitia pamoja","moyo wako mwema","kwamba tutaendelea pamoja"];
const T=s=>s.replace(/\{to\}/g,CFG.to).replace(/\{from\}/g,CFG.from||"Rafiki yako").replace(/\{m(\d)\}/g,(a,k)=>m[k-1]||FB[k-1]);
const app=$("app"),ph=CFG.ph||[],ev=CFG.ev;
const st=document.documentElement.style;st.setProperty("--b1",ev.th[0]);st.setProperty("--b2",ev.th[1]);st.setProperty("--ac",ev.th[2]);
const btn=(t,f,g)=>{const b=document.createElement("button");b.className="btn"+(g?" gh":"");b.textContent=t;b.onclick=f;return b};
let au=null;
function voice(){return btn("🎤 Sikiliza sauti yangu",()=>{if(!au)au=new Audio(CFG.au);if(bus)bus.gain.setTargetAtTime(.15,AC.currentTime,.2);au.onended=()=>{if(bus)bus.gain.setTargetAtTime(1,AC.currentTime,.4)};au.play()},1)}
const heroH=()=>ph[0]?'<img class="hero" src="'+ph[0]+'">':"";
function finale(h){
  const Q=CFG.Q;h.innerHTML='<div class="em">'+ev.e+'</div>'+heroH()+'<h1>'+T(Q.t)+'</h1><p>'+T(Q.p)+'</p>';
  h.appendChild(btn(T(Q.y),()=>{fireworks(24);hearts(80);play(3);
    h.innerHTML='<div class="em">🎆🎉🎆</div>'+heroH()+'<h1>Asante, '+CFG.to+'! 💖</h1><p>Zawadi hii imetoka moyoni mwa '+(CFG.from||"mtumaji")+'.</p>';
    h.appendChild(btn("🔁 Tazama tena",()=>location.reload(),1));if(CFG.au)h.appendChild(voice());
    setInterval(()=>{fireworks(5);hearts(20)},5000)}));
  if(Q.n){const n=btn(T(Q.n),()=>{},1);h.appendChild(n);
    if(ev.dodge){const mv=e=>{e.preventDefault();n.style.transform="translate("+rnd(-100,100)+"px,"+rnd(-60,60)+"px)"};n.addEventListener("pointerenter",mv);n.addEventListener("touchstart",mv,{passive:false});n.onclick=mv}
    else n.onclick=()=>toast("Sawa, nitasubiri kwa subira 🙏")}
  if(CFG.au)h.appendChild(voice());
}

// ===== MTINDO: SIMU =====
function phone(){
  const P=CFG.P.map(p=>p.map(T));
  app.style.padding="0";
  app.innerHTML='<div id="phn"><div id="lk"><div id="tm"></div><div id="nts"></div><div id="hn">👆 Gusa ujumbe kuufungua</div></div><div id="ch" style="display:none"><div class="hd"><b>'+(CFG.from||"Rafiki yako")+' '+ev.e+'</b><span id="ss">mtandaoni</span></div><div id="ms"></div><div id="rp"></div></div><div id="cc" style="display:none"></div></div>';
  if(ph[0])$("lk").style.backgroundImage="url("+ph[0]+")";
  const n=new Date();$("tm").textContent=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  const ping=()=>{if(AC&&!muted){const t=AC.currentTime;note(mtof(91),t,.25,"sine",.18,master);note(mtof(96),t+.12,.3,"sine",.14,master)}};
  const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
  let opened=false;
  function open(){if(opened)return;opened=true;$("lk").style.display="none";$("ch").style.display="flex";hearts(8);setTimeout(nx,900)}
  P.slice(0,3).forEach((p,k)=>setTimeout(()=>{const d=document.createElement("div");d.className="nt";d.innerHTML="<i>"+p[0]+"</i><div><b>"+(CFG.from||"Rafiki yako")+"</b><span>"+p[2].slice(0,60)+"…</span></div>";d.onclick=open;$("nts").appendChild(d);ping();vib(k?[80]:[200,100,200])},900+k*1300));
  const add=(c,h)=>{const b=document.createElement("div");b.className="b "+c;b.innerHTML=h;$("ms").appendChild(b);$("ms").scrollTop=1e6;if(c==="h")ping();return b};
  let i=0;const R=[["Aww 🥹","Asante sana 💙"],["Nimeguswa 😭","Nakupenda pia ❤️"],["Amina 🙏","Wow 😍"]];
  function nx(){
    if(i>=P.length){if(CFG.au){const b=add("h","🎤 Ujumbe wa sauti");b.appendChild(voice());setTimeout(ring,6000)}else setTimeout(ring,1500);return}
    const p=P[i++];$("ss").textContent="anaandika...";
    setTimeout(()=>{$("ss").textContent="mtandaoni";add("h",p[0]+" <b>"+p[1]+"</b><br>"+p[2]);
      if(i%2===0&&i<P.length){R[(i/2-1)%3].forEach(x=>{const b=document.createElement("button");b.textContent=x;b.onclick=()=>{$("rp").innerHTML="";add("me",x);hearts(5);setTimeout(nx,700)};$("rp").appendChild(b)})}
      else setTimeout(nx,1100)},800+p[2].length*14);
  }
  let rg;
  function ring(){
    $("ch").style.display="none";$("cc").style.display="flex";
    if(bus){bus.gain.cancelScheduledValues(AC.currentTime);bus.gain.linearRampToValueAtTime(0,AC.currentTime+.4)}clearInterval(timer);
    $("cc").innerHTML=heroH()+'<h1>'+(CFG.from||"Rafiki yako")+' anapiga simu...</h1><div class="cb"><button style="background:#ff3b5c" id="dc">📵</button><button style="background:#25d366" id="ac">📞</button></div>';
    const r=()=>{if(AC&&!muted){const t=AC.currentTime;[0,.22,.5,.72].forEach((d,k)=>note(mtof(k%2?84:79),t+d,.18,"triangle",.25,master))}vib([400,200,400])};r();rg=setInterval(r,2000);
    $("dc").onclick=()=>toast("Jibu simu, ni muhimu! 😄");
    $("ac").onclick=()=>{clearInterval(rg);play(1);const h=$("cc");finale(h)};
  }
}

// ===== KUANZA =====
function begin(){$("st0").style.display="none";$("mute").style.display="block";play(0);phone()}
$("st0").innerHTML='<div style="font-size:64px">'+ev.e+'</div><h1>Una zawadi, '+CFG.to+'</h1><p style="max-width:300px">Washa sauti kisha ufungue zawadi yako.</p>';
$("st0").appendChild(btn("🎁 FUNGUA",begin));

</script>
</body></html>
